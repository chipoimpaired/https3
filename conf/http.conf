# Settings for the http { } block (OpenResty 1.31.8.1 / nginx 1.31.8 with the patches of
# this repository). Paths are examples.
#
# nginx reads the QUIC settings (stream window, Retry, GSO, early data, the silent timeout)
# from the DEFAULT server of the listener, not from the virtual host a request is for.
# Written into a virtual host they are accepted and do nothing. At http level every server
# inherits them, the default server included.

http3_stream_buffer_size 2m;      # the 64k default allows one 64 KB window per round trip
quic_gso on;
quic_retry on;
quic_host_key /etc/nginx/quic_host.key;   # any random content. Without a fixed key the
                                          # Retry tokens of returning clients are refused
                                          # after every reload ("cannot decrypt token")
ssl_early_data on;
ssl_session_timeout 1d;

# patches/nginx-quic-client-silent.patch: close an HTTP/3 connection whose client cannot be
# heard for this long, so that the browser moves to HTTP/2 at once. 0 or no line = off.
quic_silent_timeout 4s;

# lua/npm_upload_window.lua: one timer runs per upload in progress
lua_package_path "/etc/nginx/lua/?.lua;;";
lua_max_pending_timers 16384;
lua_max_running_timers 4096;

# 0-RTT: a request that arrived in early data can be replayed by someone who recorded it.
# 1 = must not be served now (the method is not a safe one).
map "$ssl_early_data:$request_method" $early_unsafe {
    default                                                 0;
    "~^1:(?!(GET|HEAD|OPTIONS|PROPFIND|REPORT|SEARCH)$)"    1;
}
map $ssl_early_data $early_header {
    default  $http_early_data;
    1        1;
}
# first flights seen in the last two minutes, shared by all workers (replay guard below)
lua_shared_dict early_seen 10m;
