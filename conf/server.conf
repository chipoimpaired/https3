# For every server { } that proxies (for example as one included file).
# Needs the headers-more module (part of OpenResty).

# HTTP/3 is advertised with more_set_headers, not add_header: an add_header at server level
# is dropped as soon as a location adds a header of its own (HSTS for example), and HTTP/3
# silently disappears for that site.
more_set_headers 'Alt-Svc: h3=":443"; ma=86400';

# 0-RTT: anything but a safe method is answered 425 Too Early; browsers repeat such a
# request by themselves after the handshake. The upstream is told (RFC 8470).
if ($early_unsafe) {
    return 425;
}
more_set_input_headers "Early-Data: $early_header";

rewrite_by_lua_block {
    -- Uploads over HTTP/1.x: the TCP receive window follows what the sender's link carries
    -- (lua/npm_upload_window.lua).
    local uw_ok, uw = pcall(require, "npm_upload_window")
    if uw_ok then
        pcall(uw.request)
    end

    -- A recorded 0-RTT first flight sent a second time. Every connection that resumed a
    -- TLS session notes the random number of its ClientHello together with the one the
    -- server answered with. A replay is a second connection with the same ClientHello:
    -- its requests are still "early" and the table holds another server number.
    if ngx.var.ssl_session_reused ~= "r" then
        return
    end
    local ssl = require "ngx.ssl"
    local hello, ours = ssl.get_client_random(), ssl.get_server_random()
    local early = ngx.var.ssl_early_data == "1"
    if not hello or not ours then
        if early then
            return ngx.exit(425)
        end
        return
    end
    local seen = ngx.shared.early_seen
    local ok, err = seen:safe_add(hello, ours, 120)
    if ok or not early then
        return
    end
    if err == "exists" and seen:get(hello) == ours then
        return
    end
    return ngx.exit(425)
}

log_by_lua_block {
    local uw_ok, uw = pcall(require, "npm_upload_window")
    if uw_ok then
        pcall(uw.done)
    end
}
